name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 15 * * *' # 15:00 UTC = 00:00 JST
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shikakun/design-tokens build
      - run: pnpm --filter @shikakun/react build
      - uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.CONTENT_REPO_DEPLOY_KEY }}
      - run: pnpm --filter @shikakun/web content:sync
        env:
          CONTENT_REPO_URL: git@github.com:shikakun/shikakun.com-content.git
          CONTENT_REF: main
          CONTENT_REQUIRED: 'true'
      - run: pnpm --filter @shikakun/web build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config apps/web/dist/server/wrangler.json --name web
