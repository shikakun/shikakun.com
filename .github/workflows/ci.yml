name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    name: Test (axe + VRT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shikakun/design-tokens build
      - run: pnpm --filter @shikakun/react build
      - run: npx playwright install --with-deps chromium
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  storybook-vrt:
    name: Storybook VRT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shikakun/design-tokens build
      - run: pnpm --filter @shikakun/react build-storybook
      - run: npx playwright install --with-deps chromium
      - run: node node_modules/.pnpm/playwright@1.59.1/node_modules/playwright/cli.js install chromium
      - name: Run Storybook VRT
        run: |
          npx http-server packages/react/storybook-static --port 6006 &
          npx wait-on http://localhost:6006
          pnpm --filter @shikakun/react test-storybook
